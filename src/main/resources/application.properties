spring.application.name=clase
# Server
server.port=8080

# H2 Database Configuration (Descomenta para usar H2)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.url=jdbc:h2:file:./data/testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# 
# # H2 Console
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# MySQL Configuration (Descomenta para usar MySQL)
spring.datasource.url=jdbc:mysql://localhost:33066/academia
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin

# JPA
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Para ver logs detallados de seguridad
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# También puedes ver los logs de tu paquete
logging.level.es.trapasoft.clase=DEBUG
