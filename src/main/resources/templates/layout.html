<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Gestor de Alumnos">Gestor de Alumnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-50">


    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-blue-600 text-white shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <h1 class="text-2xl font-bold">Gestor de Alumnos</h1>
            </div>
        </header>
        <!-- Barra de navegación Tailwind -->
        <nav class="bg-blue-600 mb-8">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-6">
                        <a href="/" class="text-white font-bold text-xl">Academia</a>
                        <a th:href="@{/alumnos}" class="text-white hover:text-blue-200">Alumnos</a>
                        <a th:href="@{/asignaturas}" class="text-white hover:text-blue-200">Asignaturas</a>
                        <a th:href="@{/clases}" class="text-white hover:text-blue-200">Clases</a>
                        <a th:href="@{/aulas}" class="text-white hover:text-blue-200">Aulas</a>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <div layout:fragment="content">
                <!-- El contenido de las páginas se insertará aquí -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white py-4 mt-8">
            <div class="container mx-auto px-4 text-center">
                <p>&copy; 2024 Gestor de Alumnos - Spring Boot + Tailwind CSS</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>

</html>
