<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template}">
<head>
    <title>Inicio - Gestor de Alumnos</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="flex flex-col items-center justify-center py-16">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Academia" class="w-32 h-32 mb-6">
            <h2 class="text-4xl font-bold text-blue-700 mb-4">Bienvenido al Gestor de Alumnos</h2>
            <p class="text-lg text-gray-700 mb-6 text-center max-w-xl">
                Gestiona alumnos, asignaturas, clases y aulas de forma sencilla.<br>
                Utiliza la barra de navegación para acceder a las distintas secciones.
            </p>
            <a th:href="@{/alumnos}" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow transition duration-200">
                Ir a Alumnos
            </a>
        </div>
    </div>
</body>
</html>
