<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{template}">

<head>
    <title>Registro - Academia</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-md w-full space-y-8">
                <div>
                    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                        Crear una cuenta
                    </h2>
                    <p class="mt-2 text-center text-sm text-gray-600">
                        Regístrate como alumno o profesor
                    </p>
                </div>
                <form class="mt-8 space-y-6" th:action="@{/registro}" method="post" id="registroForm">
                    <div class="rounded-md shadow-sm -space-y-px">
                        <!-- Email -->
                        <div>
                            <label for="email" class="sr-only">Email</label>
                            <input id="email" name="email" type="email" required
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="Email">
                        </div>
                        <!-- Contraseña -->
                        <div>
                            <label for="password" class="sr-only">Contraseña</label>
                            <input id="password" name="password" type="password" required
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="Contraseña">
                        </div>
                        <!-- Confirmar Contraseña -->
                        <div>
                            <label for="confirmPassword" class="sr-only">Confirmar Contraseña</label>
                            <input id="confirmPassword" name="confirmPassword" type="password" required
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="Confirmar Contraseña">
                        </div>
                        <!-- Nombre -->
                        <div>
                            <label for="nombre" class="sr-only">Nombre</label>
                            <input id="nombre" name="nombre" type="text" required
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="Nombre">
                        </div>
                        <!-- Apellidos -->
                        <div>
                            <label for="apellidos" class="sr-only">Apellidos</label>
                            <input id="apellidos" name="apellidos" type="text" required
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="Apellidos">
                        </div>
                        <!-- Teléfono -->
                        <div>
                            <label for="telefono" class="sr-only">Teléfono</label>
                            <input id="telefono" name="telefono" type="tel"
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                placeholder="Teléfono">
                        </div>
                        <!-- Rol -->
                        <div>
                            <label for="rol" class="sr-only">Tipo de cuenta</label>
                            <select id="rol" name="rol" required
                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm">
                                <option value="" disabled selected>Selecciona tu tipo de cuenta</option>
                                <option value="ALUMNO">Alumno</option>
                                <option value="PROFESOR">Profesor</option>
                            </select>
                        </div>
                        <!-- Campos condicionales para Alumno -->
                        <div id="camposAlumno" style="display: none;">
                            <div>
                                <label for="numeroMatricula" class="sr-only">Número de Matrícula</label>
                                <input id="numeroMatricula" name="numeroMatricula" type="text"
                                    class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                    placeholder="Número de Matrícula">
                            </div>
                        </div>
                        <!-- Campos condicionales para Profesor -->
                        <div id="camposProfesor" style="display: none;">
                            <div>
                                <label for="numeroEmpleado" class="sr-only">Número de Empleado</label>
                                <input id="numeroEmpleado" name="numeroEmpleado" type="text"
                                    class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                    placeholder="Número de Empleado">
                            </div>
                            <div>
                                <label for="departamento" class="sr-only">Departamento</label>
                                <input id="departamento" name="departamento" type="text"
                                    class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                                    placeholder="Departamento">
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center p-3 bg-white rounded-lg border border-gray-300 shadow-sm">
                        <input id="terminos" name="terminos" type="checkbox" required
                            class="h-5 w-5 text-blue-600 focus:ring-blue-500 border-2 border-gray-400 rounded">
                        <label for="terminos" class="ml-3 block text-sm font-medium text-gray-800">
                            Acepto los <a href="#" class="text-blue-600 hover:text-blue-500 font-semibold">términos y
                                condiciones</a>
                            <span class="text-red-500 ml-1">*</span>
                        </label>
                    </div>

                    <div>
                        <button type="submit"
                            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200">
                            <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                                <svg class="h-5 w-5 text-blue-500 group-hover:text-blue-400"
                                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                                    aria-hidden="true">
                                    <path fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                        clip-rule="evenodd" />
                                </svg>
                            </span>
                            Crear cuenta
                        </button>
                    </div>

                    <!-- Mensajes de error o éxito -->
                    <div th:if="${param.error}" class="rounded-md bg-red-50 p-4">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                    fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                        clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div class="ml-3">
                                <h3 class="text-sm font-medium text-red-800">
                                    Error en el registro
                                </h3>
                                <div class="mt-2 text-sm text-red-700">
                                    <p>Ha ocurrido un error al crear la cuenta. Inténtalo de nuevo.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${param.success}" class="rounded-md bg-green-50 p-4">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <svg class="h-5 w-5 text-green-400" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                        clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div class="ml-3">
                                <h3 class="text-sm font-medium text-green-800">
                                    Registro exitoso
                                </h3>
                                <div class="mt-2 text-sm text-green-700">
                                    <p>Tu cuenta ha sido creada correctamente. Ya puedes iniciar sesión.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="text-center">
                    <p class="text-sm text-gray-600">
                        ¿Ya tienes una cuenta?
                        <a th:href="@{/login}" class="font-medium text-blue-600 hover:text-blue-500">
                            Inicia sesión aquí
                        </a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Script para mostrar/ocultar campos según el rol y validación -->
        <script>
            document.getElementById('rol').addEventListener('change', function () {
                var rol = this.value;
                document.getElementById('camposAlumno').style.display = rol === 'ALUMNO' ? 'block' : 'none';
                document.getElementById('camposProfesor').style.display = rol === 'PROFESOR' ? 'block' : 'none';

                // Hacer requeridos los campos según el rol
                document.getElementById('numeroMatricula').required = rol === 'ALUMNO';
                document.getElementById('numeroEmpleado').required = rol === 'PROFESOR';
                document.getElementById('departamento').required = rol === 'PROFESOR';
            });

            // Validación de contraseñas coincidentes
            document.getElementById('registroForm').addEventListener('submit', function (e) {
                var password = document.getElementById('password').value;
                var confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    e.preventDefault();
                    alert('Las contraseñas no coinciden');
                    return false;
                }

                if (password.length < 6) {
                    e.preventDefault();
                    alert('La contraseña debe tener al menos 6 caracteres');
                    return false;
                }
            });
        </script>
    </div>
</body>

</html>
