<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${alumno.id != null} ? 'Editar Alumno' : 'Nuevo Alumno'"></title>
</head>

<body>
    <div layout:fragment="content">
        <div class="max-w-2xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-800 mb-6"
                th:text="${alumno.id != null} ? 'Editar Alumno' : 'Nuevo Alumno'"></h2>

            <form th:action="@{/alumnos/guardar}" th:object="${alumno}" method="post"
                class="bg-white shadow-lg rounded-lg p-6 space-y-6">

                <input type="hidden" th:field="*{id}" />

                <!-- Campo Nombre -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                    <input type="text" th:field="*{nombre}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Ingrese el nombre">
                    <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-red-500 text-sm mt-1">
                    </p>
                </div>

                <!-- Campo Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" th:field="*{email}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Ingrese el email">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-sm mt-1"></p>
                </div>

                <!-- Campo Edad -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Edad</label>
                    <input type="number" th:field="*{edad}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Ingrese la edad">
                </div>
                <!-- Selector Asignaturas -->
                <label for="asignaturas">Asignaturas:</label>
                <select id="asignaturas" name="asignaturas" multiple="multiple" class="form-control">
                    <th:block th:each="asignatura : ${asignaturas}">
                        <option th:value="${asignatura.id}" th:text="${asignatura.nombre}"
                            th:selected="${alumno.asignaturas.contains(asignatura)}"></option>
                    </th:block>
                </select>
                
                <!-- Botones -->
                <div class="flex justify-end space-x-4 pt-4">
                    <a th:href="@{/alumnos}"
                        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition duration-200">
                        Cancelar
                    </a>
                    <button type="submit"
                        class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-200">
                        Guardar
                    </button>
                </div>

            </form>
        </div>
    </div>
</body>

</html>
